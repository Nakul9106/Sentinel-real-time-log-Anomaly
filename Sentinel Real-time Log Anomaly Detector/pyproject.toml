[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Real-Time Log Anomaly Detection with Slack Alerts"
authors = [
    {name = "Sentinel Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn",
    "numpy",
    "scipy",
    "joblib",
    "watchdog",
    "PyYAML",
    "requests"
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
